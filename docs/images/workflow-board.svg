<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Telemetry workflow board for IoT platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e2b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ecfeff" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="100" fill="#f0fdfa" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Telemetry Workflow Board</text>
  <text x="90" y="140" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="24">Message path from IoT device to persisted analytics records</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="90" y="250" width="210" height="90" rx="15" fill="url(#node)" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <text x="125" y="305" fill="#ccfbf1" font-size="28" font-weight="600">1 Device</text>

    <rect x="360" y="250" width="240" height="90" rx="15" fill="url(#node)" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="392" y="305" fill="#cffafe" font-size="28" font-weight="600">2 Mosquitto</text>

    <rect x="670" y="250" width="280" height="90" rx="15" fill="url(#node)" stroke="#86efac" stroke-opacity="0.7"/>
    <text x="700" y="305" fill="#dcfce7" font-size="28" font-weight="600">3 FastAPI API</text>

    <rect x="1010" y="250" width="220" height="90" rx="15" fill="url(#node)" stroke="#facc15" stroke-opacity="0.7"/>
    <text x="1042" y="305" fill="#fef9c3" font-size="28" font-weight="600">4 Redis</text>

    <rect x="1290" y="250" width="230" height="90" rx="15" fill="url(#node)" stroke="#fb7185" stroke-opacity="0.72"/>
    <text x="1320" y="305" fill="#ffe4e6" font-size="28" font-weight="600">5 Celery</text>

    <rect x="1010" y="500" width="280" height="90" rx="15" fill="url(#node)" stroke="#a5b4fc" stroke-opacity="0.72"/>
    <text x="1044" y="555" fill="#e0e7ff" font-size="28" font-weight="600">6 PostgreSQL</text>

    <line x1="300" y1="295" x2="360" y2="295" stroke="#5eead4" stroke-width="5"/>
    <line x1="600" y1="295" x2="670" y2="295" stroke="#5eead4" stroke-width="5"/>
    <line x1="950" y1="295" x2="1010" y2="295" stroke="#5eead4" stroke-width="5"/>
    <line x1="1230" y1="295" x2="1290" y2="295" stroke="#5eead4" stroke-width="5"/>
    <line x1="1405" y1="340" x2="1140" y2="500" stroke="#fda4af" stroke-width="5"/>

    <text x="90" y="700" fill="#d1fae5" font-size="30" font-weight="600">Pipeline Semantics</text>
    <text x="90" y="745" fill="#a7f3d0" font-size="24">- MQTT ingestion and API validation gate incoming telemetry.</text>
    <text x="90" y="785" fill="#a7f3d0" font-size="24">- Redis decouples network input from worker execution.</text>
    <text x="90" y="825" fill="#a7f3d0" font-size="24">- Celery tasks transform payloads and persist status snapshots.</text>
  </g>
</svg>
