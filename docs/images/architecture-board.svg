<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Architecture board for IoT and Kubernetes platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071427"/>
      <stop offset="100%" stop-color="#0f2a4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="220" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="180" cy="760" r="280" fill="#0ea5e9" fill-opacity="0.08"/>

  <text x="90" y="95" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Platform Architecture Board</text>
  <text x="90" y="132" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Distributed IoT Hub and Kubernetes Fleet Management</text>

  <rect x="90" y="190" width="250" height="120" rx="18" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.45" filter="url(#shadow)"/>
  <text x="115" y="250" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">IoT Devices</text>
  <text x="115" y="280" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="18">Telemetry + Commands</text>

  <rect x="430" y="190" width="280" height="120" rx="18" fill="url(#card)" stroke="#93c5fd" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="455" y="250" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">MQTT Broker</text>
  <text x="455" y="280" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Mosquitto</text>

  <rect x="810" y="190" width="320" height="120" rx="18" fill="url(#card)" stroke="#86efac" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="840" y="250" fill="#dcfce7" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">FastAPI Gateway</text>
  <text x="840" y="280" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Auth, Devices, Telemetry APIs</text>

  <rect x="1210" y="190" width="290" height="120" rx="18" fill="url(#card)" stroke="#f0abfc" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="1240" y="250" fill="#fae8ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Flask Admin</text>
  <text x="1240" y="280" fill="#f5d0fe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Operations Console</text>

  <rect x="760" y="430" width="260" height="120" rx="18" fill="url(#card)" stroke="#fcd34d" stroke-opacity="0.5" filter="url(#shadow)"/>
  <text x="792" y="490" fill="#fef3c7" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Redis</text>
  <text x="792" y="520" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="18">Broker + Pub/Sub</text>

  <rect x="1080" y="430" width="260" height="120" rx="18" fill="url(#card)" stroke="#fb7185" stroke-opacity="0.52" filter="url(#shadow)"/>
  <text x="1110" y="490" fill="#ffe4e6" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Celery Worker</text>
  <text x="1110" y="520" fill="#fecdd3" font-family="Segoe UI, Arial, sans-serif" font-size="18">Async Processing</text>

  <rect x="810" y="640" width="290" height="120" rx="18" fill="url(#card)" stroke="#a5b4fc" stroke-opacity="0.52" filter="url(#shadow)"/>
  <text x="845" y="700" fill="#e0e7ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">PostgreSQL</text>
  <text x="845" y="730" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Platform Persistence</text>

  <rect x="90" y="640" width="450" height="120" rx="18" fill="url(#card)" stroke="#67e8f9" stroke-opacity="0.45" filter="url(#shadow)"/>
  <text x="120" y="700" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">PySide6 Desktop Control Plane</text>
  <text x="120" y="730" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="18">Kubernetes Pods, Deployments, Logs, Status</text>

  <line x1="340" y1="250" x2="430" y2="250" stroke="#7dd3fc" stroke-width="4"/>
  <line x1="710" y1="250" x2="810" y2="250" stroke="#7dd3fc" stroke-width="4"/>
  <line x1="1130" y1="250" x2="1210" y2="250" stroke="#7dd3fc" stroke-width="4"/>
  <line x1="970" y1="310" x2="970" y2="430" stroke="#86efac" stroke-width="4"/>
  <line x1="1020" y1="490" x2="1080" y2="490" stroke="#fda4af" stroke-width="4"/>
  <line x1="1230" y1="550" x2="1090" y2="640" stroke="#c4b5fd" stroke-width="4"/>
  <line x1="220" y1="640" x2="840" y2="250" stroke="#67e8f9" stroke-width="3" stroke-dasharray="10 10"/>

  <text x="90" y="840" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Tip: replace with your production diagram export when available.</text>
</svg>
